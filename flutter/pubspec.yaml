name: khatema
description: Khatema - Quran Completion Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  percent_indicator: ^4.2.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # To enable Amiri Arabic font:
  # 1. Download Amiri-Regular.ttf and Amiri-Bold.ttf from https://fonts.google.com/specimen/Amiri
  # 2. Place in assets/fonts/
  # 3. Uncomment the fonts section below:
  # fonts:
  #   - family: Amiri
  #     fonts:
  #       - asset: assets/fonts/Amiri-Regular.ttf
  #       - asset: assets/fonts/Amiri-Bold.ttf
  #         weight: 700
